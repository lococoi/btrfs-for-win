name: ci

# Build only. Signing / publishing lives in cd.yml.
on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # x86 is not built: starting with the Windows 11 24H2 WDK (10.0.26100) there
        # are no x86 kernel libs anymore, only WDK 23H2 and older can build them.
        arch: [amd64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Required by the user: run on a Node.js runtime > 24.
      - name: Set up Node.js (>= 26)
        uses: actions/setup-node@v4
        with:
          node-version: 26
          check-latest: true

      - name: Verify Node.js version
        shell: pwsh
        run: |
          $v = (node --version).TrimStart('v')
          $major = [int]($v.Split('.')[0])
          echo "Node version: $v"
          if ($major -le 24) {
            throw "Expected Node > 24, got v$v"
          }

      # windows-latest (2025) no longer ships the Windows Driver Kit, so the km
      # headers and the kernel libs for the target arch have to be installed.
      - name: Install Windows Driver Kit
        shell: pwsh
        run: |
          # NOTE: "${env:ProgramFiles(x86)}" needs the braces. "$env:ProgramFiles(x86)"
          # silently expands to "C:\Program Files(x86)" - no space - so every path below
          # it matches nothing.
          $msarch = if ("${{ matrix.arch }}" -eq "x86") { "x86" } else { "x64" }

          function Get-KitsRoot {
            foreach ($key in @('HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots',
                               'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows Kits\Installed Roots')) {
              $reg = Get-ItemProperty $key -Name KitsRoot10 -ErrorAction SilentlyContinue
              if ($reg -and $reg.KitsRoot10 -and (Test-Path $reg.KitsRoot10)) { return $reg.KitsRoot10 }
            }
            return "${env:ProgramFiles(x86)}\Windows Kits\10"
          }

          function Get-WdkInclude([string]$root) {
            Get-ChildItem (Join-Path $root 'Include') -Directory -ErrorAction SilentlyContinue |
              Where-Object { Test-Path (Join-Path $_.FullName 'km\ntifs.h') }
          }

          function Get-WdkArchLib([string]$root) {
            Get-ChildItem (Join-Path $root 'Lib') -Directory -ErrorAction SilentlyContinue |
              Where-Object { Test-Path (Join-Path $_.FullName "km\$msarch\ntoskrnl.lib") }
          }

          $root = Get-KitsRoot
          echo "Windows Kits root: $root"

          if ((Get-WdkInclude $root) -and (Get-WdkArchLib $root)) {
            echo "WDK already present with km\$msarch libs"
            exit 0
          }

          echo "WDK not found, installing via winget..."
          winget install --id Microsoft.WindowsWDK.10.0.26100 --exact --silent `
            --accept-package-agreements --accept-source-agreements --disable-interactivity
          # winget returns non-zero for "already installed"; the check below decides.

          $root = Get-KitsRoot
          $inc = Get-WdkInclude $root
          $lib = Get-WdkArchLib $root
          if (-not $inc -or -not $lib) {
            $seen = Get-ChildItem (Join-Path $root 'Lib') -Directory -ErrorAction SilentlyContinue |
                      ForEach-Object { $_.FullName }
            throw ("WDK incomplete under '$root' (km\ntifs.h: $([bool]$inc), " +
                   "km\$msarch\ntoskrnl.lib: $([bool]$lib)). Lib dirs seen: $($seen -join ', ').")
          }
          echo "WDK installed: $($inc.FullName -join ', ') with km\$msarch libs"

      - name: Verify WDK kernel libs (${{ matrix.arch }})
        shell: pwsh
        run: |
          $kits = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots' `
                    -Name KitsRoot10 -ErrorAction SilentlyContinue
          $root = if ($kits -and $kits.KitsRoot10) { $kits.KitsRoot10 } else { "${env:ProgramFiles(x86)}\Windows Kits\10" }

          $msarch = if ("${{ matrix.arch }}" -eq "x86") { "x86" } else { "x64" }
          $libs = Get-ChildItem (Join-Path $root 'Lib') -Directory -ErrorAction SilentlyContinue |
                  Where-Object { Test-Path (Join-Path $_.FullName "km\$msarch\ntoskrnl.lib") }
          if (-not $libs) {
            $seen = Get-ChildItem (Join-Path $root 'Lib') -Directory -ErrorAction SilentlyContinue |
                      ForEach-Object { $_.FullName }
            throw "No WDK kernel libs for $msarch (km\$msarch\ntoskrnl.lib) under '$root'. Lib dirs seen: $($seen -join ', ')"
          }
          $libs | ForEach-Object { echo "kernel libs: $($_.FullName)\km\$msarch" }

      - name: Configure and build
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere)) {
            throw "vswhere.exe not found at $vswhere"
          }
          $vsPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vsPath) {
            throw "Visual Studio with the VC++ x86/x64 toolset was not found"
          }
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvarsall.bat"
          if (-not (Test-Path -LiteralPath $vcvars)) {
            throw "vcvarsall.bat not found at $vcvars"
          }

          $arch = if ("${{ matrix.arch }}" -eq "x86") { "x86" } else { "amd64" }
          $buildDir = "build\${{ matrix.arch }}"

          $cmd = "call `"$vcvars`" $arch && cmake -S . -B `"$buildDir`" -G `"NMake Makefiles`" -DCMAKE_BUILD_TYPE=Release -DWITH_TEST=OFF && cmake --build `"$buildDir`" --config Release"
          cmd /c "$cmd"
          if ($LASTEXITCODE -ne 0) {
            throw "Build failed with exit code $LASTEXITCODE"
          }

      - name: Stage artifacts
        shell: pwsh
        run: |
          $dir = "build\${{ matrix.arch }}"
          $out = "stage"
          New-Item -ItemType Directory -Force $out | Out-Null

          $required = @("btrfs.sys", "shellbtrfs.dll", "ubtrfs.dll", "mkbtrfs.exe")
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $dir $_)) }
          if ($missing) {
            throw "Missing build outputs in ${dir}: $($missing -join ', ')"
          }

          foreach ($f in $required) { Copy-Item (Join-Path $dir $f) $out }
          Get-ChildItem $dir -Filter *.pdb -ErrorAction SilentlyContinue | Copy-Item -Destination $out
          Copy-Item src/btrfs.inf, src/btrfs-vol.inf $out

          Get-ChildItem $out | ForEach-Object { "{0}  ({1:N0} bytes)" -f $_.Name, $_.Length }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: btrfs-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: stage/
