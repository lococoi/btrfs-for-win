name: build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, x86]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Required by the user: run on a Node.js runtime > 24.
      - name: Set up Node.js (>= 26)
        uses: actions/setup-node@v4
        with:
          node-version: 26
          check-latest: true

      - name: Verify Node.js version
        shell: pwsh
        run: |
          $v = (node --version).TrimStart('v')
          $major = [int]($v.Split('.')[0])
          echo "Node version: $v"
          if ($major -le 24) {
            throw "Expected Node > 24, got v$v"
          }

      - name: Configure and build
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere)) {
            throw "vswhere.exe not found at $vswhere"
          }
          $vsPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vsPath) {
            throw "Visual Studio with the VC++ x86/x64 toolset was not found"
          }
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvarsall.bat"
          if (-not (Test-Path -LiteralPath $vcvars)) {
            throw "vcvarsall.bat not found at $vcvars"
          }

          $arch = if ("${{ matrix.arch }}" -eq "x86") { "x86" } else { "amd64" }
          $buildDir = "build\${{ matrix.arch }}"

          # Load the MSVC environment, then configure + build the driver.
          $cmd = "call `"$vcvars`" $arch && cmake -S . -B `"$buildDir`" -G `"NMake Makefiles`" -DCMAKE_BUILD_TYPE=Release -DWITH_TEST=OFF && cmake --build `"$buildDir`" --config Release"
          cmd /c "$cmd"
          if ($LASTEXITCODE -ne 0) {
            throw "Build failed with exit code $LASTEXITCODE"
          }

      - name: Check for expected km include (WDK)
        shell: pwsh
        run: |
          $roots = @("${env:ProgramFiles(x86)}\Windows Kits\10", "C:\Program Files (x86)\Windows Kits\10")
          foreach ($root in $roots) {
            if (Test-Path -LiteralPath $root) {
              Get-ChildItem -Path (Join-Path $root "Include") -Directory |
                Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName "km") } |
                Select-Object -ExpandProperty FullName
            }
          }

      - name: List build outputs
        shell: pwsh
        run: |
          Get-ChildItem -Path "build\${{ matrix.arch }}" -Recurse -Include *.sys,*.dll,*.exe,*.pdb |
            ForEach-Object { $_.FullName }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: btrfs-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            build/${{ matrix.arch }}/btrfs.sys
            build/${{ matrix.arch }}/shellbtrfs.dll
            build/${{ matrix.arch }}/ubtrfs.dll
            build/${{ matrix.arch }}/mkbtrfs.exe
            build/${{ matrix.arch }}/*.pdb
